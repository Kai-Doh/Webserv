# Config for the official 42 `tester` Go binary + its YoupiBanane fixture.
# Kept separate from conf/test.conf (the HTTP+CGI harness's own demo config)
# since this one encodes the tester's very specific, somewhat artificial
# route layout rather than a realistic site.

server {
    listen 127.0.0.1:8090
    server_name localhost
    # 200MB, not the usual 1MB: the official tester POSTs a 100MB body to
    # the CGI location to exercise streaming a large payload through it
    # (verified live -- 1MB rejected that test with a 413).
    client_max_body_size 209715200

    location / {
        root www/YoupiBanane
        methods GET
        autoindex on
    }

    location /directory/ {
        root www/YoupiBanane
        methods GET POST
        index youpi.bad_extension
        # "Any file with .bla as extension must answer to POST request by
        # calling the cgi_test executable" (tester's own setup instructions)
        # is unconditional, not scoped to /youpi.bla alone -- the tester
        # exercises it here too (POST .../directory/youpi.bla).
        cgi .bla ../../cgi_tester
        # No autoindex: the official tester expects a subdirectory missing
        # youpi.bad_extension (e.g. Yeah/) to 404, not list its contents
        # (verified live).
    }

    location /youpi.bla {
        # Exact-path location: this router strips loc.path from the request
        # path and joins the remainder onto root (alias-style, per the
        # subject's /kapouet example), so an exact match leaves an empty
        # remainder -- root must be the file itself here, not its directory.
        root www/YoupiBanane/youpi.bla
        methods POST
        # Relative, not a hardcoded personal absolute path: the CGI child
        # chdir()s into www/YoupiBanane before execve() (see CgiHandler.cpp),
        # and execve() never does a PATH search -- a relative interpreter
        # path resolves against *that* new cwd, not wherever webserv itself
        # was launched from. "../../cgi_tester" from www/YoupiBanane lands
        # back at the repo root. Drop the official 42 cgi_tester binary at
        # the repo root (next to the Makefile) before running the tester
        # against this config; no path to edit either way.
        cgi .bla ../../cgi_tester
    }

    location /post_body {
        root www/YoupiBanane
        methods POST
        # Per the tester's own setup instructions: "maxBody of 100" --
        # overrides the server-wide 200MB above for this route only.
        client_max_body_size 100
    }
}
