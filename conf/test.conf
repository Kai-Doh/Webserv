# Test configuration for webserv.
# Two server blocks to exercise "listen on multiple interface:port pairs".

server {
    listen 127.0.0.1:8080
    server_name localhost
    client_max_body_size 1048576
    error_page 404 www/errors/404.html

    location / {
        root www
        index index.html
        methods GET
        autoindex off
    }

    location /listing {
        root www/listing
        methods GET
        autoindex on
    }

    location /old {
        return 301 /index.html
    }

    location /moved {
        return 302 /index.html
    }

    location /cgi-bin {
        root www/cgi-bin
        methods GET POST
        cgi .py /usr/bin/python3
        # Deliberately bogus interpreter path: any .broken file 502s
        # (execve fails in the child -> exit 127 -> Bad Gateway), for
        # demonstrating that error path without actually breaking a real
        # script.
        cgi .broken /nonexistent/interpreter
    }

    location /upload {
        root www/upload
        methods GET POST DELETE
        upload_store www/upload
        autoindex on
    }
}

server {
    # A second, genuinely distinct site (not just a copy of the first) to
    # demonstrate "listen on multiple interface:port pairs to deliver
    # different content" (subject IV.1) -- plus a tiny body limit to
    # exercise 413 on the same server block.
    listen 127.0.0.1:8081
    server_name localhost
    client_max_body_size 10

    location / {
        root www/site2
        index index.html
        methods GET POST
        upload_store www/site2/uploads
    }
}
