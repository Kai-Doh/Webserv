# Default configuration, used when webserv is launched with no argument
# (subject p.8: "a configuration file, provided as an argument on the
# command line, or available in a default path"). Serves the same site as
# conf/test.conf's first server block on the standard HTTP-alternate port.

server {
    listen 0.0.0.0:8080
    server_name localhost
    client_max_body_size 1048576
    error_page 404 www/errors/404.html

    location / {
        root www
        index index.html
        methods GET
        autoindex off
    }

    location /listing {
        root www/listing
        methods GET
        autoindex on
    }

    location /old {
        return 301 /index.html
    }

    location /moved {
        return 302 /index.html
    }

    location /cgi-bin {
        root www/cgi-bin
        methods GET POST
        cgi .py /usr/bin/python3
        cgi .broken /nonexistent/interpreter
    }

    location /upload {
        root www/upload
        methods GET POST DELETE
        upload_store www/upload
        autoindex on
    }
}
